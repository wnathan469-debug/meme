name: Application Windows téléchargeable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memeradar-windows-release
  cancel-in-progress: false
jobs:
  validation:
    uses: ./.github/workflows/x-foundation.yml
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-fund
      - run: npm run build
      - run: npm test -- --coverage
      - run: npm run format:check
      - name: Préparer le navigateur de test Windows
        timeout-minutes: 3
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($browser) {
            "CHROMIUM_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Navigateur fourni par le runner : $browser"
          } else {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Installation du navigateur impossible' }
          }
      - run: npm run test:e2e
      - run: npm run dist:win
      - name: Installer et tester l’application native Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            exit 1
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = (Resolve-Path "release/MemeRadar-$version-Windows-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'MemeRadar-installed'
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation échouée : $($process.ExitCode)" }
          $env:MEMERADAR_EXECUTABLE = Join-Path $installDir 'MemeRadar.exe'
          if (!(Test-Path $env:MEMERADAR_EXECUTABLE)) { throw 'Exécutable installé absent' }
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { throw "Test de l'application installée échoué" }
          $uninstaller = Join-Path $installDir 'Uninstall MemeRadar.exe'
          if (!(Test-Path $uninstaller)) { throw 'Désinstalleur absent' }
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $env:MEMERADAR_EXECUTABLE) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $env:MEMERADAR_EXECUTABLE) { throw 'Désinstallation incomplète' }
      - name: Créer et vérifier le ZIP de l'installateur
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $base = "MemeRadar-$version-Windows-x64"
          $exe = "release/$base.exe"
          if ((Get-Item $exe).Length -lt 50000000) { throw 'Installateur incomplet' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Path release/staging -Force | Out-Null
          Copy-Item $exe release/staging/
          @'
          MemeRadar — Windows 10/11 x64
          Extraire le ZIP puis ouvrir le fichier .exe et suivre l'assistant.
          Aucun outil de développement, Node.js, Docker ou serveur à installer.
          Mode local X : accès API et tarifs à configurer, appels désactivés au départ.
          Démonstration distincte : données entièrement fictives.
          Ce paquet n'est pas signé par un certificat d'éditeur.
          '@ | Set-Content release/staging/LIRE-MOI.txt -Encoding utf8
          "$hash  $base.exe" | Set-Content release/staging/SHA256SUMS.txt -Encoding ascii
          Copy-Item docs/DESKTOP.md release/staging/Guide-MemeRadar.md
          Copy-Item docs/FEATURE_MATRIX.md release/staging/FEATURE_MATRIX.md
          Compress-Archive -Path release/staging/* -DestinationPath "release/$base-installer.zip" -CompressionLevel NoCompression -Force
          Expand-Archive "release/$base-installer.zip" release/verify -Force
          $verified = (Get-FileHash "release/verify/$base.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($verified -ne $hash) { throw 'Le ZIP ne contient pas le bon installateur' }
          $zipHash = (Get-FileHash "release/$base-installer.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$hash  $base.exe", "$zipHash  $base-installer.zip") | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MemeRadar-Windows
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            release/MemeRadar-*-Windows-x64.exe
            release/MemeRadar-*-Windows-x64-installer.zip
            release/SHA256SUMS.txt
  publish:
    needs: [windows, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MemeRadar-Windows
          path: downloads
      - name: Vérifier et publier le téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd downloads
          sha256sum -c SHA256SUMS.txt
          cd ..
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; preserving its immutable assets."
            exit 0
          fi
          gh release create "v$version" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MemeRadar $version — Windows autonome" \
            --notes-file docs/RELEASE_NOTES.md \
            downloads/*.exe downloads/*-installer.zip downloads/SHA256SUMS.txt
