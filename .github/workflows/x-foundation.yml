name: Socle X V2 sans appel fournisseur
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-contracts-and-shared-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-fund
      - run: npm run build
      - run: npm run format:check
      - run: npm test -- --coverage
      - run: npm run test:db
      - run: npm run test:db:v2
      - run: npm run test:redis
      - run: npm run x:diagnose
      - run: npm run x:collect
      - run: npm audit --omit=dev --audit-level=moderate
